# Synology deployment: the app, its database and files stay on the NAS; a Tailscale sidecar joins the
# tailnet as its own machine (TS_HOSTNAME) and serves https://<name>.<tailnet>.ts.net with a valid
# certificate. No ports are published on the NAS. Funnel is on (tailscale/serve.json), so the site also
# opens from the internet without Tailscale (sign-in is login and password).
# To make it tailnet-only again, remove "AllowFunnel" from tailscale/serve.json.
# File format 2.4 because DSM 7.1 ships docker-compose 1.28.
#
# The database, files, keys and the Tailscale node key live in Docker named volumes, which are not shared
# folders: DSM users cannot reach them through File Station, SMB or the DSM UI. Only the encrypted backups
# sit in a shared folder (BACKUP_ROOT, owned by uid 1000). NEVER run `docker-compose down -v`: it deletes
# the volumes, i.e. all data.
#
# .env next to this file (compose variables): BACKUP_ROOT, PUBLIC_URL, optional TS_HOSTNAME, TS_AUTHKEY.
version: "2.4"

services:
  tailscale:
    image: tailscale/tailscale:v1.104.4
    container_name: company-files-tailscale
    hostname: ${TS_HOSTNAME:-files}
    restart: unless-stopped
    environment:
      TS_HOSTNAME: ${TS_HOSTNAME:-files}
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
      # Do not upload tailscaled client logs to Tailscale's log servers: connection metadata stays here.
      TS_TAILSCALED_EXTRA_ARGS: "--no-logs-no-support"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    volumes:
      - ts-state:/var/lib/tailscale
      - ./tailscale:/config:ro
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build: .
    image: company-files:latest
    container_name: company-files
    restart: unless-stopped
    network_mode: "service:tailscale"
    depends_on:
      - tailscale
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    cpu_shares: 512 # half the default weight: under load the other services on the NAS go first
    environment:
      TZ: Asia/Almaty
      # Not 127.0.0.1: Tailscale's userspace networking forwards raw tailnet connections to 127.0.0.1,
      # which would let peers skip HTTPS and fake X-Forwarded-For. Only `tailscale serve` reaches .2.
      HOST: 127.0.0.2
      PORT: "8800"
      TRUST_PROXY: "1"
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL=https://files.<tailnet>.ts.net in .env}
      APP_NAME: ${APP_NAME:-Company Files}
      DATA_DIR: /data
      BACKUP_DIR: /backup
      BACKUP_TIME: ${BACKUP_TIME:-00:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-120}
      # Sign-up codes by email (invite links). Empty SMTP_HOST keeps sign-up off. A "$" in .env is written "$$".
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # In-browser editing of office files (Collabora below). Empty keeps the editor off.
      OFFICE_URL: ${OFFICE_URL:-}
      # The editor calls Files over this compose network (milliseconds, never leaves the NAS) instead of going out
      # to the internet and back through Funnel (seconds). Only WOPI routes answer on this port.
      WOPI_PORT: "8801"
      WOPI_URL: http://company-files-tailscale:8801
      OFFICE_INTERNAL_URL: http://company-files-office-tailscale:9980
      PDF_CONVERTER_URL: http://company-files-pdfconv:8090
      MAX_FILE_GB: "50" # resumable uploads: a cut-off upload continues, so very large files are practical
    volumes:
      - data:/data
      - ${BACKUP_ROOT:?Set BACKUP_ROOT in .env}:/backup
    logging: *logging

  # Document editor: Collabora Online on its own Tailscale machine (https://office.<tailnet>.ts.net), so its
  # pages never share an origin with Files. It keeps no documents: it fetches and saves each file through the
  # Files WOPI routes with a per-file token, and Files checks access on every call.
  office-tailscale:
    image: tailscale/tailscale:v1.104.4
    container_name: company-files-office-tailscale
    hostname: office
    restart: unless-stopped
    environment:
      TS_HOSTNAME: office
      TS_AUTHKEY: ${OFFICE_TS_AUTHKEY:-}
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
      TS_TAILSCALED_EXTRA_ARGS: "--no-logs-no-support"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    volumes:
      - office-ts-state:/var/lib/tailscale
      - ./tailscale/office:/config:ro
    logging: *logging

  office:
    image: collabora/code:26.04.6.1.1
    container_name: company-files-office
    restart: unless-stopped
    network_mode: "service:office-tailscale"
    depends_on:
      - office-tailscale
    # Docker's default capabilities are kept on purpose: Collabora jails each document process with chroot.
    pids_limit: 512
    mem_limit: 1536m
    cpu_shares: 512
    environment:
      # Only documents served by Files may be opened (WOPI_URL of the app), and only Files may frame the editor.
      aliasgroup1: http://company-files-tailscale:8801
      DONT_GEN_SSL_CERT: "1"
      dictionaries: en_US en_GB ru_RU
      # DSM's kernel 4.4 has no user namespaces and rejects Collabora's own seccomp filter, so both are off:
      # document processes still run chrooted without privileges, inside Docker's default seccomp profile,
      # in a container that holds no files and can only reach Files with per-file tokens.
      extra_params: >-
        --o:ssl.enable=false --o:ssl.termination=true --o:admin_console.enable=false
        --o:logging.level=warning --o:fetch_update_check=0 --o:allow_update_popup=false --o:welcome.enable=false
        --o:security.seccomp=false --o:mount_jail_tree=false --o:net.frame_ancestors=${PUBLIC_URL}
    logging: *logging

  # PDF -> Word for editing PDFs in the browser; reached only by Files over this compose network, keeps no files.
  pdfconv:
    build: ./pdfconv
    image: company-files-pdfconv:latest
    container_name: company-files-pdfconv
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    cpu_shares: 256
    logging: *logging

volumes:
  data:
  ts-state:
  office-ts-state:
