# Builds the auto-save agent installers. The Mac .dmg needs macOS (the menu bar code uses Apple's frameworks);
# the Windows .exe and Linux .deb build anywhere, here on Linux. Download them from the run's "installers"
# artifact and put them into downloads/ for the website's Download button.
#
# Signing is optional and only happens when the repository has these secrets (Settings в†’ Secrets в†’ Actions):
#   Mac:     MACOS_CERT_P12, MACOS_CERT_PASSWORD (Developer ID Application), and for notarization either
#            APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER (App Store Connect API key, preferred)
#            or APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD
#   Windows: WINDOWS_PFX (base64 of a code-signing .pfx), WINDOWS_PFX_PASSWORD
name: Agent installers

on:
  push:
    paths: ['agent/**', '.github/workflows/agent.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-latest # Apple Silicon; the Intel half is cross-compiled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x' # the last Go that builds for macOS 12 (see build-mac.sh)
          cache-dependency-path: agent/go.sum
      - name: Build CompanyFiles.dmg (universal; signed and notarized when the secrets exist)
        run: sh agent/build-mac.sh
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-mac
          path: downloads/CompanyFiles.dmg
          if-no-files-found: error

  # The agent itself against a throwaway Files server on a real Mac: pairing, saving with the folder structure,
  # unsafe paths, catch-up, and the two-way My files sync (including the system Trash).
  mac-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x' # the last Go that builds for macOS 12 (see build-mac.sh)
          cache-dependency-path: agent/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the agent (for macOS 12 and later, like the installer)
        run: cd agent && CGO_ENABLED=1 go build -o build/agent-test .
        env: { MACOSX_DEPLOYMENT_TARGET: '12.0', CGO_CFLAGS: '-mmacosx-version-min=12.0', CGO_LDFLAGS: '-mmacosx-version-min=12.0' }
      - name: Agent checks
        run: node --disable-warning=ExperimentalWarning agent/test/e2e.mjs
        env: { AGENT: '${{ github.workspace }}/agent/build/agent-test', APP_URL: 'file://${{ github.workspace }}/', WORK: '${{ runner.temp }}' }
      - name: Two-way My files sync
        run: node --disable-warning=ExperimentalWarning agent/test/sync-e2e.mjs
        env: { AGENT: '${{ github.workspace }}/agent/build/agent-test', APP_URL: 'file://${{ github.workspace }}/', WORK: '${{ runner.temp }}' }
      - name: Network drive (Finder's WebDAV client)
        run: node --disable-warning=ExperimentalWarning agent/test/drive-e2e.mjs
        env: { AGENT: '${{ github.workspace }}/agent/build/agent-test', APP_URL: 'file://${{ github.workspace }}/', WORK: '${{ runner.temp }}' }
      - name: Screen when the drive test failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: drive-screen
          path: ${{ runner.temp }}/drive-screen.png
          if-no-files-found: ignore

  # Files on demand on a real Mac, as OneDrive does it (Apple's File Provider): the app signed with the Developer ID
  # (macOS runs the extension only then; not notarized here, nothing is downloaded with a quarantine flag), installed
  # in /Applications, connected to a throwaway server.
  mac-fileprovider-test:
    needs: mac # the very .dmg people download: signed and notarized by Apple
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: installers-mac
          path: dl
      - name: Install it in Applications
        run: |
          hdiutil attach dl/CompanyFiles.dmg -nobrowse -mountpoint /tmp/cfdmg
          cp -R "/tmp/cfdmg/Company Files.app" /Applications/
          hdiutil detach /tmp/cfdmg
          spctl -a -vv "/Applications/Company Files.app" || true
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "/Applications/Company Files.app"
          pluginkit -a "/Applications/Company Files.app/Contents/PlugIns/CompanyFilesProvider.appex" || true
          pluginkit -e use -i com.companyfiles.agent.provider || true
          pluginkit -m -v -p com.apple.fileprovider-nonui || true
      - name: Files on demand in Finder (File Provider)
        run: node --disable-warning=ExperimentalWarning agent/test/fp-e2e.mjs
        env: { AGENT: '/Applications/Company Files.app/Contents/MacOS/CompanyFiles', APP_URL: 'file://${{ github.workspace }}/', WORK: '${{ runner.temp }}' }

  # Files on demand on a clean Windows machine (the Cloud Files API, as OneDrive uses it), and the folder mode.
  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x' # the last Go that builds for macOS 12 (see build-mac.sh)
          cache-dependency-path: agent/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the agent
        run: cd agent; go build -ldflags "-H windowsgui" -o build/agent-test.exe .
      - name: Files on demand
        run: node --disable-warning=ExperimentalWarning agent/test/cloud-e2e.mjs
        env: { AGENT: '${{ github.workspace }}\agent\build\agent-test.exe', APP_URL: 'file:///${{ github.workspace }}/', WORK: '${{ runner.temp }}' }
      - name: Agent checks (folder mode)
        run: node --disable-warning=ExperimentalWarning agent/test/e2e.mjs
        env: { AGENT: '${{ github.workspace }}\agent\build\agent-test.exe', APP_URL: 'file:///${{ github.workspace }}/', WORK: '${{ runner.temp }}' }

  windows-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x' # the last Go that builds for macOS 12 (see build-mac.sh)
          cache-dependency-path: agent/go.sum
      - name: Windows certificate (only when the secret exists)
        env:
          WINDOWS_PFX: ${{ secrets.WINDOWS_PFX }}
        run: |
          if [ -n "$WINDOWS_PFX" ]; then
            sudo apt-get install -y osslsigncode >/dev/null
            printf '%s' "$WINDOWS_PFX" | base64 --decode > "$RUNNER_TEMP/sign.pfx"
            echo "SIGN_PFX=$RUNNER_TEMP/sign.pfx" >> "$GITHUB_ENV"
          fi
      - name: Build CompanyFiles-Setup.exe and company-files-agent_amd64.deb
        run: sh agent/build.sh
        env:
          SIGN_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
      - run: rm -f "$RUNNER_TEMP/sign.pfx"
        if: always()
      - uses: actions/upload-artifact@v4
        with:
          name: installers-windows-linux
          path: |
            downloads/CompanyFiles-Setup.exe
            downloads/company-files-agent_amd64.deb
          if-no-files-found: error
